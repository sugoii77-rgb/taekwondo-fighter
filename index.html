<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Fighter · 가상 대련</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;color:white;font-family:system-ui,sans-serif}canvas{width:100%;height:100%;display:block;touch-action:none;outline:none}header{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:min(700px,94vw);padding:16px 22px;background:#10202ae8;border:1px solid #ffffff30;border-radius:14px}.bars{display:flex;gap:28px}.bars label{flex:1;font-size:13px;letter-spacing:1px}progress{display:block;width:100%;height:14px;margin-top:7px;accent-color:#53edda}#enemyHP{accent-color:#ff685c}h1{font-size:16px;margin:0 0 12px;letter-spacing:3px;color:#b8d9e4}#status{font-size:13px;margin:12px 0 0;color:#ffde9a}aside{position:absolute;left:20px;bottom:24px;padding:16px;background:#10202add;border-radius:12px;font-size:13px}p{margin:6px 0;color:#c2d5df}button{border:1px solid #ffffff35;border-radius:8px;background:#1c3543;color:white;padding:11px 16px;cursor:pointer;touch-action:none}button:hover,button:active{background:#356272}.pad{display:grid;grid-template-columns:repeat(3,45px);gap:5px;margin:12px 0}.pad button{padding:10px}.actions{position:absolute;right:20px;bottom:26px;display:flex;gap:8px;flex-wrap:wrap;max-width:330px}.actions button{min-height:56px}.actions small{display:block;color:#82dbce;margin-top:5px}.toolbar{position:absolute;right:20px;top:160px;display:flex;gap:6px}footer{position:absolute;bottom:5px;left:20px;font-size:10px;color:#a8b9c5}a{color:inherit}@media(max-width:650px){aside{left:10px;bottom:30px;padding:10px}aside p{display:none}.actions{right:10px;max-width:180px;bottom:30px}.actions button{padding:9px;min-height:44px}.toolbar{right:10px;top:155px}.toolbar button{padding:8px;font-size:11px}}

strong{font-size:11px}body[data-auto="true"] .actions,body[data-auto="true"] aside .pad,body[data-auto="true"] .motion-review{display:none}body[data-auto="true"] aside{bottom:30px;max-width:calc(100vw - 20px)}} </style></head><body><canvas id="renderCanvas" aria-label="전후좌우 이동과 격투가 가능한 3D 대련장"></canvas>
<header><h1>VIRTUAL FIGHTER / 가상 대련 <span id="modeLabel" class="mode-label">수동 대련</span></h1><div class="bars"><label><span id="playerLabel">PLAYER</span> · <span id="playerValue">100</span><progress id="playerHP" max="100" value="100"></progress></label><label>COMPUTER · <span id="enemyValue">100</span><progress id="enemyHP" max="100" value="100"></progress></label></div><p id="status">피부·의상 텍스처가 있는 인체 모델을 불러오는 중…</p></header>
<div class="roster"><label>배경 <select id="background"><option value="colosseum">콜로세움</option><option value="forum">로마 포룸</option><option value="pantheon">판테온</option></select></label><label>내 캐릭터 <select id="playerCharacter"></select></label><label>대련 상대 <select id="enemyCharacter"></select></label></div><div class="toolbar"><button id="auto" aria-pressed="false" disabled>자동 대련 켜기</button><button id="pause" disabled>일시정지</button><button id="mute">소리 끄기</button><button id="ai">컴퓨터 공격 켬</button><button id="slow">느리게 보기</button><button id="reset">다시 대련</button></div>
<div class="motion-review"><strong>태권도 동작 확인</strong><select id="reviewMove"><option value="kick">앞차기</option><option value="spin">돌려차기</option><option value="side">옆차기</option><option value="back">뒤후려차기</option></select><button data-phase="0.25">무릎 들기</button><button data-phase="0.52">뻗기</button><button data-phase="0.85">회수·착지</button></div><aside><p>W A S D / 방향키 · 전후좌우</p><p>바닥 클릭 · 목적지로 이동</p><p>드래그 · 시점 회전 / 휠 · 확대</p><p>J 주먹 · K 앞차기 · L 돌려차기 · U 옆차기 · I 뒤후려차기</p><div class="pad"><span></span><button data-key="w">↑</button><span></span><button data-key="a">←</button><button data-key="s">↓</button><button data-key="d">→</button></div></aside>
<div class="actions"><button data-attack="punch">주먹<small>J</small></button><button data-attack="kick">앞차기<small>K</small></button><button data-attack="spin">돌려차기<small>L</small></button><button data-attack="side">옆차기<small>U</small></button><button data-attack="back">뒤후려차기<small>I</small></button></div>
